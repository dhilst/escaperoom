<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Hollow House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-rGgBpCsU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-zMg-iD2j.css">
  </head>
  <body>
    <main class="game">
      <header class="title-bar">
        <p id="level" class="level"></p>
        <h1 id="room-title">&nbsp;</h1>
      </header>

      <div class="screen">
        <figure class="viewport">
          <img id="camera-image" alt="" width="320" height="240" />
          <figcaption id="camera-label"></figcaption>
          <div id="subtitle" class="subtitle" aria-hidden="true" hidden></div>
          <div id="banner" class="banner" hidden>
            <strong id="banner-title"></strong>
            <span id="banner-sub"></span>
          </div>
        </figure>

        <aside class="inventory" aria-labelledby="inventory-heading">
          <h2 id="inventory-heading">Items</h2>
          <ul id="inventory-list"></ul>
        </aside>
      </div>

      <section id="hints" class="hints" aria-labelledby="hint-heading" aria-live="polite" hidden>
        <h2 id="hint-heading"></h2>
        <ol id="hint-list"></ol>
      </section>

      <div id="subtitle-live" class="sr-only" aria-live="polite"></div>

      <form id="command-form" class="prompt" autocomplete="off">
        <label for="command-input">&gt;</label>
        <input id="command-input" type="text" spellcheck="false" autocapitalize="off" autofocus
          placeholder="type a command…" />
      </form>
    </main>
  </body>
</html>
